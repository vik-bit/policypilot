[project]
name = "policypilot"
version = "0.1.0"
description = "Agentic RAG that maps new regulations to affected policy clauses, with verified citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.15,<2",
  "groq>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
neural = ["fastembed>=0.4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
policypilot = "policypilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policypilot*"]

[tool.setuptools.package-data]
policypilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
