name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The suite needs no API keys or network: both agent loops run against scripted fake
      # APIs, and retrieval uses the built-in hashing embedder (set in tests/conftest.py).
      - name: Run tests
        run: python -m pytest -q
